:root{
  --hall:#0F1E30; --hall-deep:#0A1624; --hall-raise:#17304D;
  --hall-ink:#E9EEF4; --hall-muted:#97A9BC; --hall-line:rgba(233,238,244,.18);
  --film:#08121E; --hole:rgba(233,238,244,.26);
  --screen:#FEFDFC; --ink:#404040; --muted:#6E7B87; --line:#E4E7EB;
  --blue:#0069D3; --blue-hover:#005BB8; --blue-light:#7DB8F7; --blue-tint:#EEF5FD;
  --orange:#E8912D; --orange-ink:#A3560F; --orange-tint:#FDF3E8;
  --stamp:#56479E;
  --font:Inter,"Helvetica Neue",Arial,sans-serif;
  --display:"Sofia Sans Extra Condensed","Arial Narrow",Inter,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%; background:var(--hall-deep)}
body{margin:0; min-height:100vh; min-height:100dvh; color:var(--hall-ink); font:400 16px/1.5 var(--font); font-feature-settings:"kern"; -webkit-font-smoothing:antialiased; background:var(--hall-deep)}
body::before{content:""; position:fixed; top:0; right:0; bottom:0; left:0; z-index:-1; background:radial-gradient(120% 75% at 50% -12%, var(--hall-raise) 0%, var(--hall) 46%, var(--hall-deep) 100%)}
button{font:inherit; color:inherit}
p{margin:0}
.hidden{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
:focus-visible{outline:3px solid rgba(125,184,247,.75); outline-offset:3px}
[tabindex="-1"]:focus{outline:none}

.app{position:relative; max-width:540px; margin:0 auto; padding:max(14px, env(safe-area-inset-top)) 12px max(28px, env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
section{display:flex; flex-direction:column}
#startScreen,#interScreen,#endScreen{flex:1}
#sceneScreen{flex:1}

/* buttons */
.btn{appearance:none; -webkit-appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:52px; padding:12px 22px; border-radius:10px; border:1.5px solid var(--blue); background:var(--blue); color:#fff; font:600 17px/1.2 var(--font); text-decoration:none; text-align:center; cursor:pointer; transition:background .15s, border-color .15s, transform .1s}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent; border-color:rgba(233,238,244,.42); color:var(--hall-ink)}
@media (hover:hover){
  .btn:hover{background:var(--blue-hover); border-color:var(--blue-hover)}
  .btn.ghost:hover{background:rgba(233,238,244,.08); border-color:rgba(233,238,244,.7)}
  .choice:hover{background:rgba(233,238,244,.12); border-color:rgba(233,238,244,.75)}
  button.ticket:not(:disabled):hover{transform:translateY(-2px); filter:brightness(.97)}
}
.btn.small{min-height:44px; padding:8px 16px; font-size:15px}
.btn[aria-expanded="true"]{background:var(--blue-hover); border-color:var(--blue-hover)}

/* top bar: brand, box office, film strip */
.top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin:2px 2px 10px}
.brand{font:600 14px/1.2 var(--font); color:var(--blue-light); letter-spacing:.01em}
.box{position:relative; display:flex; flex-direction:column; align-items:flex-end; line-height:1}
.box-label{font-size:12px; color:var(--hall-muted); margin-bottom:5px}
.box-value{white-space:nowrap}
.box-value b{display:inline-block; font:800 30px/.9 var(--display); color:var(--hall-ink); letter-spacing:.01em}
.box-value span{font-size:13px; color:var(--hall-muted); margin-left:2px}
.box.bump b{animation:bump .6s ease-out}
@keyframes bump{30%{color:var(--blue-light); transform:translateY(-3px)}}
.plus{position:absolute; right:calc(100% + 10px); bottom:1px; font:800 22px/1 var(--display); color:var(--blue-light); white-space:nowrap; pointer-events:none; animation:plus 1.2s ease-out forwards}
@keyframes plus{from{opacity:0; transform:translateX(10px)} 20%{opacity:1; transform:translateX(0)} 70%{opacity:1} to{opacity:0}}

.strip{position:relative; display:flex; gap:4px; padding:10px 8px; background:var(--film); border-radius:4px; margin-bottom:16px}
.strip::before,.strip::after{content:""; position:absolute; left:7px; right:7px; height:3px; background:repeating-linear-gradient(90deg, var(--hole) 0 5px, transparent 5px 11px)}
.strip::before{top:3px}
.strip::after{bottom:3px}
.strip i{flex:1; height:15px; border-radius:2px; background:#1C3048; transition:background .3s}
.strip i.cur{background:#C8D5E2}
.strip i.ok{background:var(--blue)}
.strip i.bad{background:var(--orange)}
.strip i.gap{flex:0 0 5px; background:transparent}

/* film frame: the screen inside a strip of film */
.film{position:relative; padding:10px 22px; background:var(--film); border-radius:8px; box-shadow:0 26px 70px rgba(0,0,0,.5)}
.film::before,.film::after{content:""; position:absolute; top:12px; bottom:12px; width:8px; border-radius:2px; background:repeating-linear-gradient(180deg, var(--hole) 0 7px, transparent 7px 16px)}
.film::before{left:7px}
.film::after{right:7px}
.frame{position:relative; overflow:hidden; background:var(--screen); color:var(--ink); border-radius:4px; padding:20px 18px 18px; box-shadow:0 0 60px rgba(125,184,247,.16)}

/* start */
.start{margin:auto 0}
.start .brand{margin:0 4px 14px}
.start h1{margin:4px 0 18px; font:800 clamp(58px,18vw,96px)/.84 var(--display); letter-spacing:-.004em; color:var(--ink); text-wrap:balance}
.start .lead{font-size:17px; line-height:1.5; margin:0 0 22px; max-width:30em}
.start .meta{margin:14px 0 0; font-size:14px; color:var(--muted)}
.start .btn{width:100%}
.source{margin:22px 4px 0; font-size:13px; line-height:1.5; color:var(--hall-muted)}
.source a{color:inherit; text-decoration:underline; text-decoration-color:rgba(151,169,188,.5); text-underline-offset:2px}
.source a:hover{color:var(--hall-ink)}

/* intertitle */
.inter{position:relative; margin:auto 0; padding:42px 24px 30px; border:1px solid var(--hall-line); border-radius:6px; text-align:center; background:rgba(8,18,30,.6)}
.inter::before{content:""; position:absolute; top:7px; right:7px; bottom:7px; left:7px; border:1px solid var(--hall-line); border-radius:3px; pointer-events:none}
.inter .kicker{font-size:15px; color:var(--hall-muted)}
.inter h2{margin:6px 0 20px; font:800 clamp(68px,21vw,104px)/.86 var(--display); color:var(--hall-ink); letter-spacing:-.004em}
.inter .text{margin:0 auto 10px; max-width:24em; font-size:17px; line-height:1.5}
.inter .hint{margin:0 auto 26px; max-width:24em}
.inter .btn{min-width:220px; position:relative; margin-top:8px}

/* scene */
.scene-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px; margin:0 2px 10px; font-size:14px; color:var(--hall-muted)}
.scene-head b{font-weight:600; color:var(--hall-ink)}
#stage{position:relative}
#stage:focus{outline:none}
.era .film{touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; will-change:transform; transition:transform .28s cubic-bezier(.2,.8,.3,1)}
.era .film.drag{cursor:grabbing; transition:none}
.era.done .film{cursor:default}
.era .frame{min-height:330px; min-height:clamp(330px, 58vh, 540px); display:flex; flex-direction:column}
.copy{flex:1; display:flex; flex-direction:column}
.front .copy{justify-content:center}

/* photo: the real place behind the scene, with credit */
.shot{position:relative; margin:-20px -18px 16px; overflow:hidden; border-radius:4px 4px 0 0; background:#1C3048; aspect-ratio:16 / 9}
.shot img{display:block; width:100%; height:100%; object-fit:cover; -webkit-user-drag:none; user-select:none; pointer-events:none}
.shot figcaption{position:absolute; left:0; right:0; bottom:0; padding:24px 10px 7px; font-size:11px; line-height:1.35; color:#fff; background:linear-gradient(rgba(8,18,30,0), rgba(8,18,30,.72)); text-shadow:0 1px 2px rgba(0,0,0,.35)}
.shot figcaption b{font-weight:600}
.shot figcaption a{color:inherit; text-decoration:underline; text-decoration-color:rgba(255,255,255,.5); text-underline-offset:2px}
.shot.wide{margin:0 0 12px; border-radius:8px; aspect-ratio:2.3 / 1}
@media (max-height:720px){ .shot.wide{aspect-ratio:3.2 / 1} }
.era .shot + .copy .plot{margin-top:2px}
.plot{margin:0; font:800 clamp(36px,10.5vw,52px)/1 var(--display); color:var(--ink); text-wrap:balance}
.facts{margin:auto 0 0; padding-top:22px; display:grid; grid-template-columns:auto 1fr}
.facts dt,.facts dd{margin:0; padding:9px 0; border-top:1px solid var(--line)}
.facts dt{padding-right:14px; font-size:13px; line-height:1.65; color:var(--muted)}
.facts dd{font-size:16px; font-weight:500; line-height:1.4}

.stamp{position:absolute; top:46%; left:50%; z-index:2; display:flex; flex-direction:column; align-items:center; padding:9px 16px 7px; border:3px solid var(--stamp); border-radius:7px; color:var(--stamp); font:800 46px/.86 var(--display); white-space:nowrap; opacity:0; pointer-events:none; mix-blend-mode:multiply; box-shadow:inset 0 0 0 2px var(--screen), inset 0 0 0 4px var(--stamp); transform:translate(-50%,-50%) rotate(var(--rot,-10deg))}
.stamp small{margin-top:5px; font:600 17px/1 var(--display); letter-spacing:.06em}
.stamp.left{--rot:-12deg}
.stamp.right{--rot:9deg}
.stamp.corner{top:auto; bottom:16px; right:14px; left:auto; padding:6px 11px 5px; border-width:2.5px; font-size:30px; transform:rotate(var(--rot)); opacity:.88}
.stamp.corner small{font-size:13px; margin-top:3px}
.stamp.corner.second{right:112px; bottom:20px}
.stamp.land{animation:land .3s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes land{from{opacity:0; transform:rotate(var(--rot)) scale(1.6)} to{opacity:.88; transform:rotate(var(--rot)) scale(1)}}

.reveal{display:flex; flex-direction:column; padding-bottom:70px}
.verdict{display:inline-flex; align-self:flex-start; align-items:center; gap:6px; padding:5px 11px 5px 8px; border-radius:999px; font:600 15px/1.2 var(--font)}
.verdict svg{flex:none}
.verdict.ok{color:var(--blue); background:var(--blue-tint)}
.verdict.bad{color:var(--orange-ink); background:var(--orange-tint)}
.verdict.bad svg{color:var(--orange)}
.reveal h2{margin:16px 0 4px; font:800 clamp(34px,9.4vw,48px)/.98 var(--display); color:var(--ink); text-wrap:balance}
.reveal .meta{margin:0 0 14px; font-size:15px; color:var(--muted)}
.reveal .note{font-size:16px; line-height:1.5}
.reveal.enter{animation:fadein .3s ease-out both}
@keyframes fadein{from{opacity:0}}

.controls,.actions,.share,.hint,.panel{position:relative; z-index:1}
.controls{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px}
.controls .btn{grid-column:1 / -1}
.choice{appearance:none; -webkit-appearance:none; min-height:66px; padding:8px; border-radius:10px; border:1.5px solid rgba(233,238,244,.4); background:rgba(233,238,244,.04); color:var(--hall-ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; transition:background .15s, border-color .15s, transform .1s}
.choice b{font:800 30px/1 var(--display); letter-spacing:.01em}
.choice small{font-size:12px; line-height:1.2; color:var(--hall-muted)}
.choice.hot{background:rgba(233,238,244,.12); border-color:rgba(233,238,244,.75)}
.choice:active{transform:translateY(1px)}
.hint{margin:12px 2px 0; text-align:center; font-size:13px; line-height:1.45; color:var(--hall-muted)}

/* tickets */
.tickets{display:flex; flex-direction:column; gap:12px}
.ticket{--n:58px; position:relative; display:grid; grid-template-columns:1fr var(--n); min-height:128px; background:var(--screen); color:var(--ink); border-radius:8px;
  -webkit-mask:radial-gradient(circle 9px at calc(100% - var(--n)) 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at calc(100% - var(--n)) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
  mask:radial-gradient(circle 9px at calc(100% - var(--n)) 0, #0000 97%, #000) top / 100% 51% no-repeat, radial-gradient(circle 9px at calc(100% - var(--n)) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat}
.question{margin:0 2px 12px; font:800 clamp(30px,8.4vw,40px)/1 var(--display); color:var(--hall-ink); text-wrap:balance}
button.ticket{appearance:none; -webkit-appearance:none; width:100%; border:0; padding:0; margin:0; text-align:left; font:inherit; cursor:pointer; transition:transform .12s, filter .15s, opacity .2s}
button.ticket:active{transform:translateY(1px)}
button.ticket:focus-visible{outline:none; box-shadow:inset 0 0 0 3px var(--blue-light)}
button.ticket:disabled{cursor:default; transform:none}
.ticket.dim{opacity:.72}
.ticket .main{display:flex; flex-direction:column; padding:15px 14px 14px 18px; min-width:0}
.ticket .label{display:block; font-size:15px; line-height:1.35; font-weight:500}
.ticket .value{margin-top:auto; padding-top:10px; display:flex; flex-wrap:wrap; align-items:baseline; column-gap:8px}
.ticket .value b{font:800 58px/.86 var(--display); letter-spacing:.005em; white-space:nowrap}
.ticket .value span{font-size:15px; color:var(--muted)}
.ticket .stub{display:flex; align-items:center; justify-content:center; border-left:2px dashed #CDD4DB}
.ticket .stub span{writing-mode:vertical-rl; transform:rotate(180deg); font:800 19px/1 var(--display); letter-spacing:.06em; color:var(--muted); white-space:nowrap}
.ticket.mystery .value b{color:#AEB8C2}
.ticket.ok{box-shadow:inset 5px 0 0 var(--blue)}
.ticket.bad{box-shadow:inset 5px 0 0 var(--orange)}
.panel{margin-top:12px; padding:16px 18px; background:var(--screen); color:var(--ink); border-radius:8px}
.panel .note{margin-top:10px; font-size:16px; line-height:1.5}
.panel.enter{animation:fadein .3s ease-out both}

/* result poster */
.end{margin:auto 0}
.end .brand{margin:0 4px 14px}
.poster{position:relative; background:var(--blue); color:#fff; border-radius:6px; padding:24px 22px 22px; box-shadow:0 30px 80px rgba(0,0,0,.5)}
.poster .k{font-size:16px; opacity:.88}
.poster .big{margin:6px 0 0; font:800 clamp(104px,33vw,168px)/.8 var(--display); letter-spacing:-.01em; white-space:nowrap}
.poster .unit{margin:16px 0 18px; font:800 32px/1 var(--display); letter-spacing:.01em}
.poster .cmp{margin:0 0 20px; font-size:16px; line-height:1.5; max-width:30em}
.poster .frames{display:flex; gap:4px; margin-bottom:9px}
.poster .frames i{flex:1; height:14px; border-radius:2px; background:rgba(255,255,255,.92)}
.poster .frames i.bad{background:var(--orange)}
.poster .frames i.gap{flex:0 0 5px; background:transparent}
.poster .score{font-size:14px; opacity:.88}
.actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.actions .btn{padding:12px 12px; font-size:16px}
.actions #shareBtn,.actions .wide{grid-column:1 / -1}
.share{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.share .btn{flex:1 1 120px}

/* countdown leader */
.leader{position:fixed; top:0; right:0; bottom:0; left:0; z-index:50; display:flex; align-items:center; justify-content:center; background:var(--film); cursor:pointer}
.leader .dial{position:relative; width:min(66vw,300px); aspect-ratio:1}
.leader svg{position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible}
.leader .ring{fill:none; stroke:rgba(233,238,244,.55); stroke-width:1.5}
.leader .cross{stroke:rgba(233,238,244,.3); stroke-width:1}
.leader .sweep{fill:none; stroke:rgba(125,184,247,.22); stroke-width:92; stroke-dasharray:289.03; stroke-dashoffset:289.03; transform:rotate(-90deg); transform-origin:100px 100px}
.leader .sweep.go{animation:sweep var(--t,.6s) linear forwards}
@keyframes sweep{to{stroke-dashoffset:0}}
.leader .num{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; font:800 clamp(110px,34vw,160px)/1 var(--display); color:var(--hall-ink)}
.leader .skip{position:absolute; left:0; right:0; bottom:max(28px, env(safe-area-inset-bottom)); text-align:center; font-size:13px; color:var(--hall-muted)}

.toast{position:fixed; left:50%; bottom:24px; z-index:60; max-width:calc(100% - 32px); padding:10px 16px; border-radius:10px; background:var(--screen); color:var(--ink); font-size:15px; opacity:0; pointer-events:none; transform:translate(-50%,16px); transition:opacity .2s, transform .2s}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:360px){
  .facts{grid-template-columns:1fr}
  .facts dt{padding-bottom:0; line-height:1.4}
  .facts dd{border-top:0; padding-top:2px}
  .actions{grid-template-columns:1fr}
  .stamp.corner.second{right:100px}
}
@media (min-width:480px){
  .app{padding-left:16px; padding-right:16px}
  .film{padding:12px 28px}
  .film::before{left:9px}
  .film::after{right:9px}
  .frame{padding:24px 24px 20px}
  .shot{margin:-24px -24px 18px}
  .shot.wide{margin:0 0 12px}
  .ticket{--n:66px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}

<script>
(function(){
'use strict';
var D = JSON.parse(document.getElementById('quiz-data').textContent);
var U = D.ui, S = D.scenes, TOTAL = S.length;
var PER = D.maxViewers / TOTAL;
var $ = function(s){ return document.querySelector(s); };
var mm = function(q){ return !!(window.matchMedia && window.matchMedia(q).matches); };
var REDUCED = mm('(prefers-reduced-motion: reduce)');

var EMBEDDED = window.self !== window.top;

/* ---------- typography: no hanging short words, numbers stay with units ---------- */
var SHORT = /(^|[\s(«"])([ВвКкСсУуОоИиАаЯ]|во|Во|на|На|по|По|до|До|из|Из|от|От|за|За|не|Не|об|Об|со|Со|но|Но|ко|Ко|же|ли) /g;
function typo(s){
  s = String(s);
  s = s.replace(SHORT, '$1$2 ').replace(SHORT, '$1$2 ');
  s = s.replace(/(\d) (?=(млн|млрд|тыс|год|раз|фильм|проект|кадр|билет|из|человек|зрител|миллион|%))/g, '$1 ');
  s = s.replace(/ (млн|тыс)\. /g, ' $1. ');
  s = s.replace(/XXI /g, 'XXI ');
  s = s.replace(/([А-Яа-яЁё])-([А-Яа-яЁё])/g, '$1‑$2');
  return s;
}
function plain(s){ return String(s).replace(/ /g, ' ').replace(/‑/g, '-'); }
function fill(t, v){ return String(t).replace(/\{(\w+)\}/g, function(_, k){ return v[k] != null ? v[k] : ''; }); }
function txt(el, s){ el.textContent = typo(s); return el; }
function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === 'text') el.textContent = typo(attrs[k]);
    else if (k === 'html') el.innerHTML = attrs[k];
    else el.setAttribute(k, attrs[k]);

  for (var i = 2; i < arguments.length; i++){ var c = arguments[i]; if (c != null) el.append(c); }

}
function fmt(x, d){ return x.toFixed(d == null ? 1 : d).replace('.', ','); }
function fmtBox(x){ return x < 0.05 ? '0' : fmt(x); }
function viewersFor(score){ return Math.round(score * PER * 10) / 10; }

var ICON = {
  ok: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.6l4.3 4.2L19 7.2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad: '<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>'
};

/* ---------- static texts ---------- */
['#topBrand', '#startBrand', '#endBrand'].forEach(function(s){ txt($(s), D.brand); });
txt($('#startTitle'), D.title);
txt($('#startLead'), D.lead);
txt($('#startBtn'), U.start);
txt($('#startMeta'), D.meta);
txt($('#boxLabel'), U.box);
txt($('#boxUnit'), ' ' + U.unit);
txt($('#leaderSkip'), U.skip);
txt($('#endKicker'), U.endKicker);
txt($('#endUnit'), U.endUnit);
txt($('#shareBtn'), U.share);
txt($('#againBtn'), U.again);
txt($('#shCopy'), U.copy);
txt($('#shMore'), U.more_share);
var articleBtn = $('#articleBtn');
if (D.articleUrl){ articleBtn.href = D.articleUrl; txt(articleBtn, U.article); } else { articleBtn.classList.add('hidden'); $('#againBtn').classList.add('wide'); }
function sourceLine(el){
  el.textContent = '';
  el.append(typo(U.sourceBefore));
  var a = D.articleUrl ? h('a', { href: D.articleUrl, target: '_blank', rel: 'noopener', text: '«' + D.articleTitle + '»' }) : typo('«' + D.articleTitle + '»');
  el.append(a, typo(U.sourceAfter), h('a', { href: D.channel.url, target: '_blank', rel: 'noopener', text: '«' + D.channel.name + '»' }), '.');
}
sourceLine($('#startSource')); sourceLine($('#endSource'));

/* ---------- state ---------- */
var idx = 0, results = [], answered = false, shownParts = {}, viewers = 0, busy = false;
var stage = $('#stage'), controls = $('#controls');

function toTop(el){
  window.scrollTo(0, 0);
  if (EMBEDDED && el) try { el.scrollIntoView({ block: 'start' }); } catch (_) {}
}
function show(id){
  ['#startScreen', '#interScreen', '#sceneScreen', '#endScreen'].forEach(function(s){ $(s).classList.toggle('hidden', s !== id); });
  var inGame = id === '#interScreen' || id === '#sceneScreen';
  $('#top').classList.toggle('hidden', !inGame);
  $('#strip').classList.toggle('hidden', !inGame);
  toTop($('#app'));
}
function live(s){ var l = $('#live'); l.textContent = ''; setTimeout(function(){ l.textContent = plain(typo(s)); }, 60); }

function partOf(i){ for (var p = 0; p < D.parts.length; p++) if (D.parts[p].id === S[i].part) return p; return 0; }
function partRange(p){
  var id = D.parts[p].id, first = -1, n = 0;
  for (var i = 0; i < TOTAL; i++) if (S[i].part === id){ if (first < 0) first = i; n++; }
  return { first: first, n: n };
}

function drawStrip(){
  var st = $('#strip'); st.textContent = '';
  for (var i = 0; i < TOTAL; i++){
    if (i > 0 && S[i].part !== S[i - 1].part) st.append(h('i', { class: 'gap' }));
    var cls = i < results.length ? (results[i] ? 'ok' : 'bad') : (i === idx && !$('#sceneScreen').classList.contains('hidden') ? 'cur' : '');
    st.append(h('i', { class: cls }));
  }
}
function setBox(v, animate){
  var b = $('#boxValue');
  if (!animate || REDUCED){ b.textContent = fmtBox(v); return; }
  var from = viewers, t0 = performance.now(), dur = 450;
  (function step(t){
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);

  var plus = h('span', { class: 'plus', text: '+' + fmt(v - from) }); box.append(plus);
  setTimeout(function(){ plus.remove(); }, 1200);
}

/* ---------- countdown leader ---------- */
function leader(done){
  if (REDUCED){ done(); return; }
  var el = $('#leader'), num = $('#leaderNum'), sweep = $('#sweep'), n = 3, timer = null, over = false;
  el.classList.remove('hidden');
  function finish(){ if (over) return; over = true; clearTimeout(timer); el.classList.add('hidden'); el.removeEventListener('click', finish); done(); }

    if (over) return;
    if (n === 0){ finish(); return; }
    num.textContent = n;
    sweep.classList.remove('go'); void sweep.getBoundingClientRect(); sweep.classList.add('go');
    n--; timer = setTimeout(tick, 600);
  }
  el.addEventListener('click', finish);
  tick();
}

/* ---------- flow ---------- */
function start(){
  preload(0); preload(1);
  idx = 0; results = []; shownParts = {}; viewers = 0; answered = false; setShare(false);
  setBox(0, false);
  leader(function(){ step(); });
}
function step(){
  var p = partOf(idx);
  if (!shownParts[p]){ intertitle(p); return; }
  render();
}
function intertitle(p){
  var part = D.parts[p];
  shownParts[p] = true;
  txt($('#interKicker'), part.kicker);
  txt($('#interTitle'), part.title);
  txt($('#interText'), part.text);
  var hint = COARSE ? part.hintTouch : part.hintMouse;
  txt($('#interHint'), hint || '');
  $('#interHint').classList.toggle('hidden', !hint);
  txt($('#interBtn'), part.button);
  show('#interScreen'); drawStrip();
  try { $('#interTitle').focus({ preventScroll: true }); } catch (_) {}
}
$('#interBtn').addEventListener('click', render);

function render(){
  answered = false; busy = false;
  var sc = S[idx], p = partOf(idx), r = partRange(p);
  show('#sceneScreen'); drawStrip();
  txt($('#sceneTitle'), D.parts[p].title);
  txt($('#sceneCount'), fill(sc.type === 'era' ? U.frameCount : U.ticketCount, { n: idx - r.first + 1, total: r.n }));
  stage.textContent = ''; controls.textContent = '';
  if (sc.type === 'era') renderEra(sc, idx - r.first + 1, r.n); else renderTicket(sc, idx - r.first + 1, r.n);
  preload(idx + 1);
  try { stage.focus({ preventScroll: true }); } catch (_) {}
}

var preloaded = {};
function preload(i){
  var sc = S[i];
  if (!sc || !sc.photo || preloaded[sc.photo.src]) return;
  preloaded[sc.photo.src] = true;
  var im = new Image(); im.decoding = 'async'; im.src = sc.photo.src;
}
function photoEl(p, wide){
  if (!p) return null;
  var cap = h('figcaption');
  cap.append(h('b', { text: p.caption + '.' }), ' ', typo(U.photoBy));
  cap.append(p.page ? h('a', { href: p.page, target: '_blank', rel: 'noopener', text: p.author }) : typo(p.author), ', ');
  var lic = p.license.replace(/ (?=[\dA-Z])/g, ' ').replace(/-/g, '‑');
  if (p.licenseUrl){ var la = h('a', { href: p.licenseUrl, target: '_blank', rel: 'noopener license' }); la.textContent = lic; cap.append(la); }
  else cap.append(typo(p.license));
  return h('figure', { class: 'shot' + (wide ? ' wide' : '') }, h('img', { src: p.src, alt: plain(typo(p.caption)), decoding: 'async', draggable: 'false' }), cap);
}

function stampEl(era, cls){
  var e = D.eras[era];
  return h('div', { class: 'stamp ' + cls, 'aria-hidden': 'true' }, typo(e.label), h('small', { text: e.years }));
}

/* ----- part 1: era cards ----- */
function renderEra(sc, n, total){
  var wrap = h('div', { class: 'era' });
  var frame = h('div', { class: 'frame front' });
  var copy = h('div', { class: 'copy' }, h('p', { class: 'plot', text: sc.plot }));
  if (sc.facts && sc.facts.length){
    var dl = h('dl', { class: 'facts' });
    sc.facts.forEach(function(f){ dl.append(h('dt', { text: f[0] }), h('dd', { text: f[1] })); });
    copy.append(dl);
  }
  frame.append(photoEl(sc.photo, false), copy, stampEl('ussr', 'left'), stampEl('now', 'right'));
  var film = h('div', { class: 'film', role: 'group', 'aria-label': plain(typo(sc.plot)) }, frame);
  wrap.append(film); stage.append(wrap);

  var bL = h('button', { class: 'choice', type: 'button', id: 'choiceL' }, h('b', { text: D.eras.ussr.label }), h('small', { text: D.eras.ussr.years }));
  var bR = h('button', { class: 'choice', type: 'button', id: 'choiceR' }, h('b', { text: D.eras.now.label }), h('small', { text: D.eras.now.years }));
  bL.addEventListener('click', function(){ decideEra('ussr', false); });
  bR.addEventListener('click', function(){ decideEra('now', false); });
  controls.append(bL, bR);
  $('#hint').textContent = '';
  live(fill(U.liveFrame, { n: n, total: total, plot: sc.plot }));
  attachDrag(film, frame, bL, bR);
}

function attachDrag(film, frame, bL, bR){
  var sL = frame.querySelector('.stamp.left'), sR = frame.querySelector('.stamp.right');
  var pid = null, x0 = 0, y0 = 0, dx = 0, lock = null;
  function thr(){ return Math.min(110, film.offsetWidth * 0.26); }
  function paint(){
    var t = Math.max(-1.2, Math.min(1.2, dx / thr()));
    film.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
    sL.style.opacity = t < 0 ? Math.min(0.88, -t * 0.88) : 0;
    sR.style.opacity = t > 0 ? Math.min(0.88, t * 0.88) : 0;
    bL.classList.toggle('hot', t <= -1); bR.classList.toggle('hot', t >= 1);
  }
  function reset(){
    dx = 0; film.classList.remove('drag'); film.style.transform = '';
    sL.style.opacity = 0; sR.style.opacity = 0; bL.classList.remove('hot'); bR.classList.remove('hot');
  }
  film.addEventListener('pointerdown', function(e){
    if (answered || busy || (e.pointerType === 'mouse' && e.button !== 0)) return;
    pid = e.pointerId; x0 = e.clientX; y0 = e.clientY; dx = 0; lock = null;
  });
  film.addEventListener('pointermove', function(e){
    if (e.pointerId !== pid || answered) return;
    var mx = e.clientX - x0, my = e.clientY - y0;
    if (!lock){
      if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) * 1.15){ lock = 'x'; film.classList.add('drag'); try { film.setPointerCapture(pid); } catch (_) {} }

  });

    if (e.pointerId !== pid) return;
    pid = null;
    if (lock === 'x' && Math.abs(dx) >= thr()){ var side = dx < 0 ? 'ussr' : 'now'; film.classList.remove('drag'); decideEra(side, true); }
    else reset();
    lock = null;
  }
  film.addEventListener('pointerup', end);
  film.addEventListener('pointercancel', function(e){ if (e.pointerId === pid){ pid = null; lock = null; reset(); } });
  film.addEventListener('dragstart', function(e){ e.preventDefault(); });
}

function decideEra(choice, fromDrag){
  if (answered || busy) return;
  answered = true; busy = true;
  var sc = S[idx], ok = sc.answer === 'both' || sc.answer === choice;
  results.push(ok);
  var wrap = stage.querySelector('.era'), film = wrap.querySelector('.film'), frame = wrap.querySelector('.frame');
  var bL = $('#choiceL'), bR = $('#choiceR'); bL.disabled = true; bR.disabled = true;
  var chosen = frame.querySelector(choice === 'ussr' ? '.stamp.left' : '.stamp.right');
  frame.querySelectorAll('.stamp').forEach(function(s){ if (s !== chosen) s.style.opacity = 0; });
  chosen.style.opacity = 0.88;
  if (!fromDrag && !REDUCED){
    var dir = choice === 'ussr' ? -1 : 1;
    film.style.transform = 'translateX(' + (dir * 22) + 'px) rotate(' + (dir * 1.4) + 'deg)';
  }
  setTimeout(function(){
    film.style.transform = '';
    wrap.classList.add('done');
    frame.classList.remove('front');
    frame.querySelectorAll('.stamp').forEach(function(s){ s.remove(); });
    var copy = frame.querySelector('.copy'); copy.textContent = '';
    var vText = sc.answer === 'both' ? U.both : (ok ? U.ok : fill(U.badEra, { era: D.eras[sc.answer].label }));
    var verdict = h('p', { class: 'verdict ' + (ok ? 'ok' : 'bad') });
    verdict.innerHTML = ok ? ICON.ok : ICON.bad; verdict.append(typo(vText));
    var rv = h('div', { class: 'reveal enter' }, verdict, h('h2', { text: sc.title }), h('p', { class: 'meta', text: sc.meta }), h('p', { class: 'note', text: sc.note }));
    copy.append(rv);
    var eras = sc.answer === 'both' ? ['ussr', 'now'] : [sc.answer];
    eras.forEach(function(er, i){ frame.append(stampEl(er, 'corner land ' + (er === 'ussr' ? 'left' : 'right') + (i ? ' second' : ''))); });
    after(ok, vText + '. ' + sc.title + ', ' + sc.meta + '. ' + sc.note);
  }, (fromDrag || REDUCED) ? 120 : 260);
}

/* ----- part 2: pick the ticket with the bigger figure; the pair is shuffled every time ----- */
function ticketBtn(t, key){
  var btn = h('button', { class: 'ticket mystery', type: 'button', 'data-key': key },
    h('span', { class: 'main' }, h('span', { class: 'label', text: t.label }), h('span', { class: 'value' }, h('b', { text: U.mystery }))),
    h('span', { class: 'stub', 'aria-hidden': 'true' }, h('span', { text: t.tag || '' })));
  btn.addEventListener('click', function(){ decideTicket(key); });
  return btn;
}
function renderTicket(sc, n, total){
  var keys = Math.random() < 0.5 ? ['a', 'b'] : ['b', 'a'];
  var shot = photoEl(sc.photo, true);
  if (shot) stage.append(shot);
  stage.append(h('p', { class: 'question', id: 'question', text: sc.q }));
  var box = h('div', { class: 'tickets', role: 'group', 'aria-labelledby': 'question' });
  keys.forEach(function(k){ box.append(ticketBtn(sc[k], k)); });
  stage.append(box);
  $('#hint').textContent = '';
  live(fill(U.liveTicket, { n: n, total: total, q: sc.q, a: sc[keys[0]].label, b: sc[keys[1]].label }));
}
function countUp(el, value){
  var m = /^(.*?)(\d+(?:,\d+)?)(.*)$/.exec(value);
  if (!m || REDUCED){ el.textContent = typo(value); return; }
  var target = parseFloat(m[2].replace(',', '.')), dec = (m[2].split(',')[1] || '').length, t0 = performance.now(), dur = 650;
  (function step(t){
    var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    el.textContent = typo(m[1] + fmt(target * e, dec) + m[3]);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}
function decideTicket(key){
  if (answered || busy) return;
  answered = true; busy = true;
  var sc = S[idx], ok = sc.answer === key;
  results.push(ok);
  stage.querySelectorAll('.ticket').forEach(function(tk){
    var k = tk.getAttribute('data-key'), t = sc[k];
    tk.disabled = true;
    tk.classList.remove('mystery');
    tk.classList.add(k === sc.answer ? 'ok' : (k === key ? 'bad' : 'dim'));
    var val = tk.querySelector('.value'); val.textContent = '';
    var b = h('b'); val.append(b);
    if (t.unit) val.append(h('span', { text: t.unit }));
    countUp(b, t.value);
  });
  var vText = ok ? U.okTicket : U.badTicket;
  var verdict = h('p', { class: 'verdict ' + (ok ? 'ok' : 'bad') });
  verdict.innerHTML = ok ? ICON.ok : ICON.bad;
  verdict.append(typo(vText));
  stage.append(h('div', { class: 'panel enter' }, verdict, h('p', { class: 'note', text: sc.note })));
  function said(t){ return t.label + ': ' + t.value + (t.unit ? ' ' + t.unit : ''); }
  after(ok, vText + '. ' + said(sc.a) + '. ' + said(sc.b) + '. ' + sc.note);
  // on short screens the note and the next button land below the fold: bring them up once the figures have counted
  var nb = $('#nextBtn');
  setTimeout(function(){
    if (nb && nb.isConnected && nb.getBoundingClientRect().bottom > window.innerHeight)
      try { nb.scrollIntoView({ block: 'end', behavior: REDUCED ? 'auto' : 'smooth' }); } catch (_) {}
  }, REDUCED ? 0 : 700);
}

function after(ok, liveText){
  var score = results.filter(Boolean).length, v = viewersFor(score);
  if (ok){ setBox(v, true); }
  viewers = v;
  drawStrip();
  controls.textContent = '';
  var last = idx === TOTAL - 1;
  var next = h('button', { class: 'btn', type: 'button', id: 'nextBtn', text: last ? U.finish : U.next });
  next.addEventListener('click', function(){ idx++; if (idx >= TOTAL) end(); else step(); });
  controls.append(next);
  $('#hint').textContent = '';
  live(liveText);
  busy = false;
  setTimeout(function(){ try { next.focus({ preventScroll: true }); } catch (_) {} }, 50);
}

/* ---------- result ---------- */
function tierFor(v){ for (var i = 0; i < D.tiers.length; i++) if (v >= D.tiers[i].min - 1e-9) return D.tiers[i]; return D.tiers[D.tiers.length - 1]; }
function end(){
  var score = results.filter(Boolean).length, v = viewersFor(score);
  show('#endScreen');
  txt($("#endBig"), fmtBox(v));
  txt($('#endCmp'), tierFor(v).text);
  txt($('#endScore'), fill(U.score, { score: score, total: TOTAL }));
  var fr = $('#endFrames'); fr.textContent = '';
  for (var i = 0; i < TOTAL; i++){
    if (i > 0 && S[i].part !== S[i - 1].part) fr.append(h('i', { class: 'gap' }));
    fr.append(h('i', { class: results[i] ? 'ok' : 'bad' }));
  }
  live(fill(U.endKicker + ' {v} ' + U.endUnit + '. ', { v: fmt(v) }) + tierFor(v).text + ' ' + fill(U.score, { score: score, total: TOTAL }));
  try { $('#endBig').focus({ preventScroll: true }); } catch (_) {}
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if ($('#sceneScreen').classList.contains('hidden') || answered || e.altKey || e.ctrlKey || e.metaKey) return;
  var sc = S[idx];
  if (sc.type === 'era'){
    if (e.key === 'ArrowLeft'){ e.preventDefault(); decideEra('ussr', false); }
    else if (e.key === 'ArrowRight'){ e.preventDefault(); decideEra('now', false); }
  } else {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
      var tks = stage.querySelectorAll('.ticket');
      if (tks.length === 2){ e.preventDefault(); decideTicket(tks[e.key === 'ArrowUp' ? 0 : 1].getAttribute('data-key')); }
    }
  }
});

/* ---------- share: own menu (the system sheet on a PC offers odd apps and no Telegram) ---------- */
var shareMenu = $('#shareMenu'), shareBtn = $('#shareBtn');
function shareUrl(){ return /^https?:/.test(location.href) ? location.href.split('#')[0].split('?')[0] : (D.articleUrl || D.channel.url); }
function shareLine(){ return plain(fill(U.shareText, { viewers: fmt(viewers), score: results.filter(Boolean).length, total: TOTAL })); }
function setShare(open){ shareMenu.classList.toggle('hidden', !open); shareBtn.setAttribute('aria-expanded', String(open)); }
var toastTimer = null;
function toast(msg, ms){ var t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, ms || 2200); }
function copyText(text){
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed; top:0; left:0; opacity:0';
    document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
    toast(ok ? U.copied : text, ok ? 2200 : 6000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(U.copied); }, fallback); else fallback();
}
shareBtn.addEventListener('click', function(){
  var open = shareMenu.classList.contains('hidden');
  if (open){
    var url = encodeURIComponent(shareUrl()), line = encodeURIComponent(shareLine());
    $('#shTg').href = 'https://t.me/share/url?url=' + url + '&text=' + line;
    $('#shVk').href = 'https://vk.com/share.php?url=' + url + '&title=' + line;
  }
  setShare(open);
});
$('#shCopy').addEventListener('click', function(){ copyText(shareLine() + ' ' + shareUrl()); });
if (navigator.share && COARSE){
  var more = $('#shMore'); more.classList.remove('hidden');
  more.addEventListener('click', function(){ navigator.share({ text: shareLine(), url: shareUrl() }).catch(function(){}); });
}
$('#startBtn').addEventListener('click', start);
$('#againBtn').addEventListener('click', start);
})();
</script>
